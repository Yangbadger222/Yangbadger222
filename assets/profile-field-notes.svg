<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Jiahan Yang — robotics field notes</title>
  <desc id="desc">A warm paper-and-grid notebook banner with hand-drawn robotics annotations and a rover sketch.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9bb0b2" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="softNoise">
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="multiply"/>
    </filter>
  </defs>

  <rect width="1200" height="430" rx="18" fill="#efe9dc"/>
  <rect x="18" y="18" width="1164" height="394" rx="10" fill="#f6f1e6" filter="url(#paper)"/>
  <rect x="18" y="18" width="1164" height="394" rx="10" fill="url(#grid)"/>

  <path d="M18 360 C150 348 250 374 360 361 C500 343 615 372 741 357 C893 340 1030 371 1182 353" fill="none" stroke="#c28b83" stroke-opacity="0.28" stroke-width="3" stroke-dasharray="10 8"/>

  <g transform="translate(72 62)">
    <rect x="0" y="0" width="168" height="42" rx="2" fill="#2f2c29" transform="rotate(-1 84 21)"/>
    <text x="19" y="29" fill="#f8f4ea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="1.5">FIELD NOTES / 2026</text>

    <text x="0" y="120" fill="#2f2c29" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" letter-spacing="2">JIAHAN YANG</text>
    <path d="M4 136 C96 143 202 129 312 138" fill="none" stroke="#b9716c" stroke-width="5" stroke-linecap="round"/>

    <text x="2" y="183" fill="#49575b" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="29" font-style="italic">robots · maps · learning · things that finally worked</text>

    <text x="0" y="242" fill="#4a4743" font-family="Arial, Helvetica, sans-serif" font-size="22">Mechatronics &amp; Robotic Systems @ XJTLU</text>
    <text x="0" y="279" fill="#4a4743" font-family="Arial, Helvetica, sans-serif" font-size="22">autonomous navigation · robot learning · embodied systems</text>

    <g transform="translate(4 318) rotate(-2)">
      <rect x="0" y="0" width="370" height="36" fill="#d7c48e" fill-opacity="0.45"/>
      <text x="14" y="25" fill="#42535a" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="20">build → test → break → understand → repeat.</text>
    </g>
  </g>

  <g transform="translate(735 48) rotate(1)">
