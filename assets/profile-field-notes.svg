    <path d="M145 63 L145 20 M266 48 L266 5" stroke="#373735" stroke-width="4"/>
    <path d="M131 20 L160 20 M252 5 L281 5" stroke="#373735" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="204" cy="111" rx="27" ry="11" fill="#f4eee2" stroke="#373735" stroke-width="4"/>
    <path d="M184 110 L184 89 Q204 75 224 89 L224 110" fill="#5b7c83" fill-opacity="0.32" stroke="#373735" stroke-width="3"/>
    <circle cx="92" cy="276" r="39" fill="#f6f1e6" stroke="#373735" stroke-width="5"/>
    <circle cx="205" cy="281" r="43" fill="#f6f1e6" stroke="#373735" stroke-width="5"/>
    <circle cx="330" cy="276" r="39" fill="#f6f1e6" stroke="#373735" stroke-width="5"/>
    <circle cx="92" cy="276" r="14" fill="#c0b8aa" stroke="#373735" stroke-width="3"/>
    <circle cx="205" cy="281" r="15" fill="#c0b8aa" stroke="#373735" stroke-width="3"/>
    <circle cx="330" cy="276" r="14" fill="#c0b8aa" stroke="#373735" stroke-width="3"/>
    <path d="M58 271 L22 288 M364 271 L401 290" stroke="#373735" stroke-width="4" stroke-linecap="round"/>

    <path d="M279 41 C342 28 388 34 424 57" fill="none" stroke="#4f666b" stroke-width="3" stroke-linecap="round"/>
    <path d="M423 57 l-13 -5 l5 13" fill="none" stroke="#4f666b" stroke-width="3"/>
    <text x="346" y="28" fill="#4f666b" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="20">dual RTK</text>

    <path d="M222 95 C304 82 357 94 394 117" fill="none" stroke="#4f666b" stroke-width="3" stroke-linecap="round"/>
    <text x="324" y="145" fill="#4f666b" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="20">MID-360</text>

    <text x="26" y="348" fill="#6e5c55" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="20" transform="rotate(-4 26 348)">built to get lost less often :)</text>
  </g>

  <g transform="translate(1020 70) rotate(4)">
    <rect x="0" y="0" width="120" height="75" fill="#c88f88" fill-opacity="0.55"/>
    <text x="18" y="31" fill="#453f3b" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="18">currently</text>
    <text x="18" y="56" fill="#453f3b" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="18">building →</text>
  </g>
</svg>